{% extends 'shop/base.html' %}

{% block title %}Блог - Поради для садівників{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-5">Поради для садівників</h1>
    
    <div class="row">
        {% for post in posts %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="{{ post.image }}" class="card-img-top" alt="{{ post.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content|truncatewords:30 }}</p>
                    <a href="{% url 'shop:blog_detail' post.slug %}" class="btn btn-primary">Читати далі</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
