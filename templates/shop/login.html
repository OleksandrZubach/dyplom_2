{% extends 'shop/base.html' %}
{% load static %}

{% block title %}Вхід - Сад та Город{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Вхід</h2>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <form method="post" action="{% url 'shop:login_view' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Ім'я користувача</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Увійти</button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <p>Немає облікового запису? <a href="{% url 'shop:register' %}" class="text-success">Зареєструватися</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
